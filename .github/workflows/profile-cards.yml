name: Refresh profile cards

on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - scripts/generate_cards.py
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKER: VEDANK
        run: python scripts/generate_cards.py "${{ github.repository_owner }}" assets

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "Refresh profile cards"
          git push
