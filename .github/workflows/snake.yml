name: Contribution snake

on:
  schedule:
    - cron: "37 */4 * * *" # every 4 hours, so new contributions show up the same day
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

# Never let two runs race to force-push the output branch.
concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F7931A&color_dots=#161b22,#b8650f,#e07d10,#F7931A,#FFD166

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
