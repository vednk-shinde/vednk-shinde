<svg xmlns="http://www.w3.org/2000/svg" width="467" height="232" viewBox="0 0 467 232" role="img" aria-label="vednk-shinde GitHub stats">
<defs>
  <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFD166"/><stop offset="100%" stop-color="#F7931A"/></linearGradient>
</defs>
<style>
  .row { opacity: 0; animation: slideIn .6s ease-out forwards; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes grow { to { transform: scaleX(1); } }
  .dot { transform-box: fill-box; transform-origin: center; animation: beat 2.4s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.5); } }
  .border { animation: trace 6s linear infinite; }
  @keyframes trace { to { stroke-dashoffset: -1390; } }
  .live { animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
</style>
<rect width="467" height="232" rx="8" fill="#0d1117"/>
<rect class="border" x="1" y="1" width="465" height="230" rx="8" fill="none" stroke="#F7931A" stroke-width="1.5"
      stroke-dasharray="120 1270" stroke-linecap="round" opacity="0.8"/>
<text x="25" y="34" fill="#F7931A" font-size="18" font-weight="700" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif">GitHub Stats</text>
<circle class="live" cx="400" cy="29" r="4" fill="#3fb950"/>
<text x="440" y="33" fill="#3fb950" font-size="11" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="end">LIVE</text>
