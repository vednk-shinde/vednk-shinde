 style="animation-delay:0.66s"/><text x="46" y="136" fill="#c9d1d9" font-size="13" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif">Issues</text><rect x="250" y="127" width="110" height="6" rx="3" fill="#21262d"/><rect class="bar" x="250" y="127" width="4.0" height="6" rx="3" fill="url(#barGrad)" style="animation-delay:0.86s"/><text x="440" y="136" fill="#F7931A" font-size="13" font-weight="700" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="end">0</text></g><g class="row" style="animation-delay:0.78s"><circle class="dot" cx="32" cy="156" r="3.5" fill="#F7931A" style="animation-delay:0.78s"/><text x="46" y="160" fill="#c9d1d9" font-size="13" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif">Code Reviews</text><rect x="250" y="151" width="110" height="6" rx="3" fill="#21262d"/><rect class="bar" x="250" y="151" width="4.0" height="6" rx="3" fill="url(#barGrad)" style="animation-delay:0.98s"/><text x="440" y="160" fill="#F7931A" font-size="13" font-weight="700" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="end">0</text></g><g class="row" style="animation-delay:0.90s"><circle class="dot" cx="32" cy="180" r="3.5" fill="#F7931A" style="animation-delay:0.90s"/><text x="46" y="184" fill="#c9d1d9" font-size="13" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif">Public Repos</text><rect x="250" y="175" width="110" height="6" rx="3" fill="#21262d"/><rect class="bar" x="250" y="175" width="58.8" height="6" rx="3" fill="url(#barGrad)" style="animation-delay:1.10s"/><text x="440" y="184" fill="#F7931A" font-size="13" font-weight="700" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="end">31</text></g><g class="row" style="animation-delay:1.02s"><circle class="dot" cx="32" cy="204" r="3.5" fill="#F7931A" style="animation-delay:1.02s"/><text x="46" y="208" fill="#c9d1d9" font-size="13" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif">Stars Earned</text><rect x="250" y="199" width="110" height="6" rx="3" fill="#21262d"/><rect class="bar" x="250" y="199" width="4.0" height="6" rx="3" fill="url(#barGrad)" style="animation-delay:1.22s"/><text x="440" y="208" fill="#F7931A" font-size="13" font-weight="700" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="end">0</text></g>
</svg>
